<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Regula Falsi - Numerical Methods Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Collapsible Sidebar - collapses to 70px, expands on hover -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="material-icons">functions</span>
                    <h2 class="logo-text">Regula Falsi</h2>
                </div>
                <p class="logo-sub logo-text">False Position Method</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                    <span class="material-icons">description</span>
                    <span class="nav-text">Discussion</span>
                </a>
                <a href="{{ url_for('examples') }}" class="nav-item {% if request.endpoint == 'examples' %}active{% endif %}">
                    <span class="material-icons">school</span>
                    <span class="nav-text">Worked Examples</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-item {% if request.endpoint == 'calculator' %}active{% endif %}">
                    <span class="material-icons">calculate</span>
                    <span class="nav-text">Calculator</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="version">
                    <span class="material-icons">science</span>
                    <span class="version-text">Numerical Methods v1.0</span>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <script>
        // No JavaScript needed - pure CSS hover effect
    </script>
</body>
</html>
